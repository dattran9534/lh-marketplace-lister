<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LH Lister</title>
  <meta name="theme-color" content="#c8102e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LH Lister">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="phone.css">
</head>
<body>
  <!-- Sign in -->
  <section id="login" class="screen" hidden>
    <div class="login-card">
      <div class="mark">LH</div>
      <h1>LH Lister</h1>
      <p class="muted">Sign in with the same account you use in the PC app.</p>
      <div id="setupFields" hidden>
        <label>Supabase project URL<input id="cfgUrl" type="url" placeholder="https://xxxx.supabase.co" autocapitalize="off"></label>
        <label>Publishable key<input id="cfgKey" type="text" placeholder="sb_publishable_..." autocapitalize="off"></label>
      </div>
      <label>Email<input id="email" type="email" autocomplete="username" autocapitalize="off"></label>
      <label>Password<input id="password" type="password" autocomplete="current-password"></label>
      <button id="signInBtn" class="primary big">Sign in</button>
      <p id="loginMsg" class="msg"></p>
    </div>
  </section>

  <!-- Main -->
  <section id="main" class="screen" hidden>
    <header class="bar">
      <div>
        <h1>Inventory</h1>
        <p id="pcStatus" class="pc"><span class="dot"></span><span class="txt">Checking your PC…</span></p>
      </div>
      <div class="bar-actions">
        <button id="addCarBtn" class="icon" aria-label="Add a car by link">＋</button>
        <button id="refreshBtn" class="icon" aria-label="Refresh">⟳</button>
        <button id="menuBtn" class="icon" aria-label="More">⋯</button>
      </div>
    </header>
    <div class="stats" id="stats"></div>
    <div class="filters">
      <div class="chips" id="chips">
        <button data-f="all" class="chip active">All</button>
        <button data-f="notposted" class="chip">Not posted</button>
        <button data-f="Active" class="chip">Active</button>
        <button data-f="Pending" class="chip">Pending</button>
        <button data-f="Sold" class="chip">Sold</button>
      </div>
      <input id="search" type="search" placeholder="Search year, make, model">
    </div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="muted center" hidden>No cars yet. Import one on the PC, or tap ＋ to add one by link.</p>
    <div id="activity" class="activity"></div>
  </section>

  <!-- Car details (bottom sheet) -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <div class="grab"></div>
      <button id="closeSheet" class="icon close" aria-label="Close">✕</button>
      <div id="dPhotos" class="photos"></div>
      <div class="photo-actions">
        <label class="btn secondary"><input id="addPhotos" type="file" accept="image/*" multiple hidden>Add photos</label>
        <span id="photoMsg" class="muted small"></span>
      </div>
      <h2 id="dTitle"></h2>
      <p id="dMeta" class="muted"></p>
      <div class="price-row">
        <span id="dPrice" class="price"></span>
        <button id="dPriceBtn" class="link">Change price</button>
      </div>
      <div id="dPriceEdit" class="price-edit" hidden>
        <span>$</span><input id="dPriceInput" type="number" inputmode="numeric" min="0">
        <button id="dPriceSave" class="primary">Save</button>
        <button id="dPriceCancel" class="link">Cancel</button>
      </div>
      <div id="dActions" class="actions"></div>
      <div id="dRequests" class="requests"></div>
      <div id="dDescBox">
        <h3>Description</h3>
        <textarea id="dDesc" rows="7"></textarea>
        <button id="dDescSave" class="secondary">Save description</button>
      </div>
    </div>
  </div>

  <!-- Menu -->
  <div id="menu" class="sheet" hidden>
    <div class="sheet-card small-card">
      <div class="grab"></div>
      <p id="whoAmI" class="muted"></p>
      <button id="syncFbBtn" class="secondary big">Ask PC to sync with Facebook</button>
      <button id="installHelpBtn" class="secondary big">How to add to Home Screen</button>
      <button id="signOutBtn" class="link big">Sign out</button>
      <p id="installHelp" class="muted small" hidden>In Safari, tap the Share button (square with an arrow), then <b>Add to Home Screen</b>. It opens like an app after that.</p>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="phone.js"></script>
</body>
</html>
